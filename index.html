<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2 First Prep</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#8347e9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem('b2:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Разделы">
    <a class="brand" href="#home"><span class="logo"><svg viewBox="1 1 30 30" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9.5v13h4.6a3.25 3.25 0 0 0 0-6.5H8h4.1a3.25 3.25 0 0 0 0-6.5z"/><path d="M18.4 12.6a3.4 3.4 0 1 1 6 2.2L18.4 22.5h6.4"/></svg></span><span>First Prep</span></a>
    <div class="hud" id="hud"></div>
    <div class="nav" id="nav"></div>
    <div class="side-foot">
      <div class="side-tools">
        <button class="btn sm ghost" id="themeBtn" type="button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span id="themeLbl">Тема: как в системе</span>
        </button>
        <button class="btn sm ghost" id="soundBtn" type="button" aria-pressed="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path id="soundWave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          <span id="soundLbl">Звук: вкл</span>
        </button>
      </div>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Прогресс хранится в этом браузере</span></div>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <button class="btn sm ghost" id="menuBtn" type="button" aria-label="Меню">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="#home" aria-label="B2 First Prep — главная"><span class="logo"><svg viewBox="1 1 30 30" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9.5v13h4.6a3.25 3.25 0 0 0 0-6.5H8h4.1a3.25 3.25 0 0 0 0-6.5z"/><path d="M18.4 12.6a3.4 3.4 0 1 1 6 2.2L18.4 22.5h6.4"/></svg></span></a>
      <span class="sp"></span>
      <div class="hud mini" id="hudTop"></div>
    </div>
    <div id="view" class="ex-body"></div>
  </div>
</div>
<div id="modal"></div>
<div id="fx" aria-hidden="true"></div>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
